# pnpm 12 escribe un env lockfile delante del del proyecto cuando gestiona su
# propia versión; Trivy solo lee el primero y no audita el frontend. CI fija
# la versión con pnpm/action-setup, así que aquí no hace falta la autogestión.
pmOnFail: ignore
allowBuilds:
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@pinia/nuxt@1.0.3'
  - pinia@4.1.0
  - node-forge@1.4.1

overrides:
  # GHSA-3g3m-2fjr-6pw4 / GHSA-g3hv-75wg-m249: retirar cuando @vercel/nft y ESLint declaren glob >=14 y minimatch >=11.
  "glob@13": "^14.0.2"
  "minimatch@10": "^11.0.1"
  serialize-javascript: ">=7.1.3"
  node-forge: ">=1.4.1"
