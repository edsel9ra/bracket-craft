name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bracket_craft
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bracket_craft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run unit tests without database
        working-directory: backend
        run: pytest -q
      - name: Create application role
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/infra:ro" \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e POSTGRES_DB=bracket_craft -e POSTGRES_USER=postgres \
            -e PGPASSWORD=postgres_test_password \
            -e BRACKET_DB_PASSWORD=bracket_app_test_password \
            -e APP_ENV=development \
            postgres:17-alpine bash /infra/init/00_roles.sh
      - name: Initialize database schema
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/infra:ro" \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGUSER=postgres -e PGPASSWORD=postgres_test_password \
            -e PGDATABASE=bracket_craft \
            postgres:17-alpine sh -c \
            'psql -v ON_ERROR_STOP=1 -f /infra/init/01_schema.sql &&
             psql -v ON_ERROR_STOP=1 -f /infra/init/02_public_projections.sql &&
             psql -v ON_ERROR_STOP=1 -f /infra/init/03_hardening.sql'
      - name: Apply migrations with administrator role
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/infra:ro" \
            -e DATABASE_URL="postgresql://postgres:postgres_test_password@127.0.0.1:5432/bracket_craft" \
            postgres:17-alpine sh /infra/migrate.sh
      - name: Test MIGRATION_TARGET in migration runner
        run: |
          docker run --rm --network host \
            -v "$PWD/infra:/infra:ro" \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGUSER=postgres -e PGPASSWORD=postgres_test_password \
            postgres:17-alpine sh /infra/scripts/test_migrate_target.sh
      - name: Run database tests with application role
        working-directory: backend
        env:
          RUN_DATABASE_TESTS: '1'
          DATABASE_URL: postgresql+asyncpg://bracket_app:bracket_app_test_password@127.0.0.1:5432/bracket_craft
          DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres_test_password@127.0.0.1:5432/bracket_craft
        run: pytest -q
      - name: Compile application
        working-directory: backend
        run: python -m compileall -q app

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        working-directory: frontend
        run: pnpm test
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Build
        working-directory: frontend
        run: pnpm run build

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reference versions
        run: python3 infra/scripts/verify_version_sources.py --exclude-constitution
      - name: Validate migration script
        run: sh -n infra/postgres/migrate.sh
      - name: Check Docker Compose version
        run: |
          compose_version="$(docker compose version --short)"
          echo "Docker Compose ${compose_version}"
          python3 infra/scripts/assert_production_compose.py --compose-version "${compose_version}"
      - name: Validate Compose configuration (development)
        run: docker compose config -q
      - name: Check environment contract (development)
        run: docker compose config --format json | python3 infra/scripts/check_env_contract.py -
      - name: Assert development Compose structure
        run: docker compose config --format json | python3 infra/scripts/assert_production_compose.py --profile development -
      - name: Validate Compose configuration (development + production)
        env:
          POSTGRES_PASSWORD: dummy-postgres-password
          BRACKET_DB_PASSWORD: dummy-bracket-db-password
          PLATFORM_ADMIN_EMAIL: dummy@example.test
          JWT_SECRET: dummy-jwt-secret-with-at-least-32-characters
          PLAYER_DATA_KEY: dummy-player-key-with-at-least-32-characters
          INVITATION_TOKEN_KEY: dummy-invitation-key-with-at-least-32-characters
          DATABASE_URL: postgresql+asyncpg://dummy:dummy@db:5432/dummy
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          STORAGE_PROVIDER: s3
          STORAGE_BUCKET: dummy
          STORAGE_PUBLIC_BASE_URL: http://localhost:9000/dummy
          FRONTEND_BASE_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_FROM: noreply@example.test
          NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
          NUXT_PUBLIC_SOCKET_BASE: http://localhost:8000
          NUXT_API_INTERNAL_BASE: http://api:8000/api/v1
          PROXY_NETWORK: edge
        run: |
          docker compose -f docker-compose.yml -f docker-compose.production.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --format json \
            | python3 infra/scripts/assert_production_compose.py -
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --format json \
            | python3 infra/scripts/check_env_contract.py -

  security:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 12.12.1
      - name: Audit frontend dependencies
        shell: bash
        run: |
          AUDIT_JSON="/tmp/pnpm-audit.json"
          trap 'rm -f "$AUDIT_JSON"' EXIT
          if pnpm --dir frontend audit --prod --json --audit-level low > "$AUDIT_JSON"; then status=0; else status=$?; fi
          PYTHONDONTWRITEBYTECODE=1 python3 infra/scripts/audit_frontend.py --input "$AUDIT_JSON" --pnpm-status "$status"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: frontend/node_modules,frontend/.pnpm-store,.venv
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'

  e2e:
    name: Realtime retry end-to-end
    # Cada pull_request y solo los push a main: un push a una rama de trabajo no
    # ejecuta el job (y no se interpreta como verde).
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Compatibilidad de desarrollo del arnés: la misma pila, el mismo motor
      # (Chromium headless) y la cuenta ficticia del seed demo. No hay secretos:
      # son los valores documentados de .env.example y scripts.seed_demo.
      E2E_BASE_URL: http://localhost:3000
      E2E_API_BASE: http://localhost:8000/api/v1
      E2E_EMAIL: demo.owner@bracketcraft.dev
      E2E_PASSWORD: 'Demo1234!'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-
      - name: Install Chromium only
        working-directory: frontend
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck the end-to-end harness
        working-directory: frontend
        timeout-minutes: 5
        run: pnpm run typecheck:e2e
      - name: Prepare the development environment
        timeout-minutes: 1
        run: cp .env.example .env
      - name: Start the development stack
        timeout-minutes: 6
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Seed demo data
        timeout-minutes: 3
        run: docker compose exec -T api python -m scripts.seed_demo
      # Veredicto propio 0/1/2/3 (verde, comportamiento, infraestructura,
      # corrida inválida). Sin reintentos: playwright.config.ts fija retries: 0.
      - name: Run the realtime retry end-to-end scenario
        working-directory: frontend
        timeout-minutes: 16
        run: pnpm run e2e:test
      # El volcado es diagnóstico: si el saneado fallara se omite el fichero,
      # nunca se publica el registro en crudo ni se convierte en el veredicto.
      - name: Collect sanitized server logs
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p frontend/e2e-report
          docker compose logs --no-color api worker web > "$RUNNER_TEMP/e2e-server.log" 2>&1 || true
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            import { redactLog } from './frontend/e2e/artifacts.ts';
            writeFileSync(
              'frontend/e2e-report/server.log',
              redactLog(readFileSync(process.env.RUNNER_TEMP + '/e2e-server.log', 'utf8')),
            );
          "
      # Solo el informe saneado del arnés: nada de trace.zip (cabeceras con
      # cookies), de .auth/state.json ni de logs sin sanear.
      - name: Upload end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-realtime-${{ github.run_id }}
          path: frontend/e2e-report
          retention-days: 7
          if-no-files-found: warn
      - name: Stop the development stack
        if: always()
        timeout-minutes: 3
        run: docker compose down -v
