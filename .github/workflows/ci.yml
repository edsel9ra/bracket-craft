name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bracket_craft
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bracket_craft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit tests without database
        working-directory: backend
        run: pytest -q
      - name: Create application role
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/infra:ro" \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e POSTGRES_DB=bracket_craft -e POSTGRES_USER=postgres \
            -e PGPASSWORD=postgres_test_password \
            -e BRACKET_DB_PASSWORD=bracket_app_test_password \
            -e APP_ENV=development \
            postgres:17-alpine bash /infra/init/00_roles.sh
      - name: Initialize database schema
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/infra:ro" \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGUSER=postgres -e PGPASSWORD=postgres_test_password \
            -e PGDATABASE=bracket_craft \
            postgres:17-alpine sh -c \
            'psql -v ON_ERROR_STOP=1 -f /infra/init/01_schema.sql &&
             psql -v ON_ERROR_STOP=1 -f /infra/init/02_public_projections.sql &&
             psql -v ON_ERROR_STOP=1 -f /infra/init/03_hardening.sql'
      - name: Apply migrations with administrator role
        run: |
          docker run --rm --network host \
            -v "$PWD/infra/postgres:/infra:ro" \
            -e DATABASE_URL="postgresql://postgres:postgres_test_password@127.0.0.1:5432/bracket_craft" \
            postgres:17-alpine sh /infra/migrate.sh
      - name: Run database tests with application role
        working-directory: backend
        env:
          RUN_DATABASE_TESTS: '1'
          DATABASE_URL: postgresql+asyncpg://bracket_app:bracket_app_test_password@127.0.0.1:5432/bracket_craft
          DATABASE_ADMIN_URL: postgresql+asyncpg://postgres:postgres_test_password@127.0.0.1:5432/bracket_craft
        run: pytest -q
      - name: Compile application
        working-directory: backend
        run: python -m compileall -q app

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        working-directory: frontend
        run: pnpm test
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Build
        working-directory: frontend
        run: pnpm run build

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration script
        run: sh -n infra/postgres/migrate.sh
      - name: Validate Compose configuration
        run: docker compose config -q

  security:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: frontend/node_modules,frontend/.pnpm-store,.venv
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
