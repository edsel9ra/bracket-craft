version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Node 24 es la versión de referencia (constitución §3.5): sus tipos no deben superar ese major.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
