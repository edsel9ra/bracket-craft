services:
  db:
    ports: []
    environment:
      APP_ENV: production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BRACKET_DB_PASSWORD: ${BRACKET_DB_PASSWORD:?BRACKET_DB_PASSWORD must be set}

  db-migrate:
    environment:
      APP_ENV: production
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL must be set}

  api:
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PLAYER_DATA_KEY: ${PLAYER_DATA_KEY:?PLAYER_DATA_KEY must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:?STORAGE_PROVIDER must be set}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET must be set}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:?STORAGE_PUBLIC_BASE_URL must be set}
      AUTH_COOKIE_SECURE: "true"
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}
    ports: []
    volumes: []

  worker:
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PLAYER_DATA_KEY: ${PLAYER_DATA_KEY:?PLAYER_DATA_KEY must be set}
    volumes: []

  redis:
    ports: []

  web:
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?NUXT_PUBLIC_API_BASE must be set}
      NUXT_PUBLIC_SOCKET_BASE: ${NUXT_PUBLIC_SOCKET_BASE:?NUXT_PUBLIC_SOCKET_BASE must be set}
      NUXT_API_INTERNAL_BASE: ${NUXT_API_INTERNAL_BASE:?NUXT_API_INTERNAL_BASE must be set}
    command: node .output/server/index.mjs
    ports: []
    volumes: []
